name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-test-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build and run the test suite
        run: |
          dotnet build SimsOnline.Client/SimsOnline.Client.csproj
          dotnet build DedicatedServer.Tests/SimsOnline.DedicatedServer.Tests.csproj
          dotnet run --project DedicatedServer.Tests/SimsOnline.DedicatedServer.Tests.csproj -- --filter all

      - name: Publish DedicatedServer (Windows x64)
        run: dotnet publish DedicatedServer/SimsOnline.DedicatedServer.csproj -c Release -r win-x64 --self-contained false -o ./dist/DedicatedServer-win-x64

      - name: Publish SimsOnline.Client (Windows x64)
        run: dotnet publish SimsOnline.Client/SimsOnline.Client.csproj -c Release -r win-x64 --self-contained false -o ./dist/SimsOnline.Client-win-x64

      - name: Publish DedicatedServer (Linux x64)
        run: dotnet publish DedicatedServer/SimsOnline.DedicatedServer.csproj -c Release -r linux-x64 --self-contained false -o ./dist/DedicatedServer-linux-x64

      - name: Upload .NET dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-dist
          path: ./dist
          if-no-files-found: error

  build-rust-win-x64:
    # simlink_bridge binds Win32 process/shared-memory APIs under #[cfg(windows)],
    # so the runnable headless server executable must be built on Windows. Clean-room
    # tests disable `repo-integration` so oracle/local-fixture dev tests stay offline.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clippy
        shell: pwsh
        run: rustup component add clippy

      - name: Clippy clean-room check (simlink_headless_server)
        shell: pwsh
        run: cargo clippy --manifest-path rust/simlink_headless_server/Cargo.toml --locked --no-default-features --all-targets -- -D warnings

      - name: Run clean-room Rust unit/protocol tests
        shell: pwsh
        run: cargo test --manifest-path rust/simlink_headless_server/Cargo.toml --locked --no-default-features

      - name: Build simlink_headless_server (Windows x64 Release)
        shell: pwsh
        run: cargo build --manifest-path rust/simlink_headless_server/Cargo.toml --locked --release --bin simlink_headless_server

      - name: Stage simlink_headless_server (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist/simlink_headless_server-win-x64 | Out-Null
          Copy-Item ./rust/simlink_headless_server/target/release/simlink_headless_server.exe ./dist/simlink_headless_server-win-x64/
          Copy-Item ./rust/simlink_headless_server/README.md ./dist/simlink_headless_server-win-x64/
          Copy-Item ./rust/simlink_headless_server/SYNC_POLICY.md ./dist/simlink_headless_server-win-x64/

      - name: Upload Rust headless server artifact
        uses: actions/upload-artifact@v4
        with:
          name: simlink-headless-server-win-x64
          path: ./dist/simlink_headless_server-win-x64
          if-no-files-found: error

  package-and-release:
    needs: [build-and-test-dotnet, build-rust-win-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # only to create the draft release; the token is not kept in the checkout
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download .NET dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-dist
          path: ./dist

      - name: Download Rust headless server artifact
        uses: actions/download-artifact@v4
        with:
          name: simlink-headless-server-win-x64
          path: ./dist/simlink_headless_server-win-x64

      - name: Package Release Archives
        # The tag name comes from whoever pushed the tag: pass it as data, never interpolate it into the script.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ./release-artifacts
          cp LICENSE README.md ./dist/
          (cd ./dist && zip -qr "../release-artifacts/Sims3Online-win-x64-${RELEASE_TAG}.zip" DedicatedServer-win-x64 SimsOnline.Client-win-x64 simlink_headless_server-win-x64 LICENSE README.md)
          (cd ./dist && zip -qr "../release-artifacts/simlink_headless_server-win-x64-${RELEASE_TAG}.zip" simlink_headless_server-win-x64 LICENSE README.md)
          tar -czvf "./release-artifacts/Sims3Online-linux-x64-${RELEASE_TAG}.tar.gz" -C ./dist DedicatedServer-linux-x64 LICENSE README.md
          (cd ./release-artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release-artifacts/*
          draft: true
          generate_release_notes: true
